# Frontend (statik fayllar) va API bitta manzilda: brauzer uchun CORS kerak emas.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Rasm yuklash API'da MAX_UPLOAD_MB gacha ruxsat etilgan; nginx undan kichik bo'lmasin.
    client_max_body_size 7m;

    # So'rov yo'li o'zgarmasdan uzatiladi (URI qo'shilmagan proxy_pass): imzo shunga bog'liq.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://api:8000;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri $uri/ =404;
        # Yangi versiya chiqqanda eski JS/CSS keshdan olinmasin.
        add_header Cache-Control "no-cache";
    }
}
