<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; img-src 'self' data:; connect-src 'self'; style-src 'self'; base-uri 'none'; form-action 'self'">
  <title>Ovqatlar — Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/pages/admin-menu.js"></script>
</head>
<body>
  <main>
    <form id="filters" class="card" role="search">
      <div class="admin-toolbar">
        <input name="search" type="text" maxlength="100" placeholder="Ovqat nomi" aria-label="Qidiruv">
        <a class="btn" href="/admin/item.html">+ Qo'shish</a>
      </div>
      <div class="filters">
        <select name="category" aria-label="Kategoriya"><option value="">Barcha kategoriyalar</option></select>
        <select name="available" aria-label="Holat">
          <option value="">Hammasi</option>
          <option value="true">Sotuvda</option>
          <option value="false">Tugagan</option>
        </select>
      </div>
    </form>
    <div id="items"></div>
    <button id="more" class="btn btn-ghost btn-block" type="button" hidden>Yana ko'rsatish</button>
  </main>
</body>
</html>
