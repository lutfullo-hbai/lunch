<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; img-src 'self' data:; connect-src 'self'; style-src 'self'; base-uri 'none'; form-action 'self'">
  <title>Userlar — Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/pages/admin-users.js"></script>
</head>
<body>
  <main>
    <form id="filters" class="card" role="search">
      <input name="search" type="text" maxlength="100" placeholder="Ism, email yoki telefon" aria-label="Qidiruv">
      <div class="filters">
        <select name="role" aria-label="Rol">
          <option value="">Barcha rollar</option>
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
        <select name="is_active" aria-label="Holat">
          <option value="">Faol va bloklangan</option>
          <option value="true">Faol</option>
          <option value="false">Bloklangan</option>
        </select>
      </div>
    </form>
    <h2 id="total-count"></h2>
    <div id="users"></div>
    <button id="more" class="btn btn-ghost btn-block" type="button" hidden>Yana ko'rsatish</button>
  </main>
</body>
</html>
