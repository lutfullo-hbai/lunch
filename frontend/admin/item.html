<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; img-src 'self' data: blob:; connect-src 'self'; style-src 'self'; base-uri 'none'; form-action 'self'">
  <title>Ovqat — Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/pages/admin-item.js"></script>
</head>
<body>
  <main>
    <p><a href="/admin/menu.html">← Ovqatlar</a></p>
    <h1 id="title">Yangi ovqat</h1>
    <form id="item-form" class="card" novalidate hidden>
      <label for="name">Nomi</label>
      <input id="name" name="name" type="text" maxlength="150" required>
      <p id="error-name" class="field-error" role="alert"></p>

      <label for="price">Narxi (so'm)</label>
      <input id="price" name="price" type="text" inputmode="decimal" placeholder="45000" required>
      <p id="error-price" class="field-error" role="alert"></p>

      <label for="category_id">Kategoriya</label>
      <select id="category_id" name="category_id" required><option value="">Tanlang</option></select>
      <p id="error-category_id" class="field-error" role="alert"></p>

      <label for="portion">Porsiya (ixtiyoriy)</label>
      <input id="portion" name="portion" type="text" maxlength="50" placeholder="1 porsiya, 0.5 l">
      <p id="error-portion" class="field-error" role="alert"></p>

      <label for="description">Tavsif (ixtiyoriy)</label>
      <textarea id="description" name="description" maxlength="1000"></textarea>
      <p id="error-description" class="field-error" role="alert"></p>

      <label>Rasm</label>
      <div class="image-box">
        <img id="preview" alt="Ovqat rasmi" hidden>
        <span id="no-image" class="hint">Rasm yo'q</span>
      </div>
      <div class="image-actions">
        <label class="btn btn-ghost" for="image-input">Rasm tanlash</label>
        <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <span id="remove-image"></span>
      </div>
      <p id="error-image" class="field-error" role="alert"></p>
      <p class="hint">JPEG, PNG yoki WebP. Rasm saqlash tugmasi bosilganda yuklanadi.</p>

      <label class="check"><input name="is_available" type="checkbox" checked> Sotuvda</label>

      <p id="form-error" class="error" role="alert"></p>
      <div class="form-actions">
        <button class="btn" type="submit">Saqlash</button>
        <div id="danger-zone" class="form-actions"></div>
      </div>
    </form>
  </main>
</body>
</html>
