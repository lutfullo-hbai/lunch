<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; img-src 'self' data:; connect-src 'self'; style-src 'self'; base-uri 'none'; form-action 'self'">
  <title>Savat — Lunch</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/pages/cart.js"></script>
</head>
<body>
  <main>
    <h2 id="lines-title">Savatdagi ovqatlar</h2>
    <div id="lines"></div>
    <section id="summary" hidden>
      <h2>To'lov turi</h2>
      <form id="payment" class="card">
        <div class="pay-options">
          <label class="pay-option"><input type="radio" name="payment_method" value="cash"><span id="cash-icon"></span><span>Naqd</span></label>
          <label class="pay-option"><input type="radio" name="payment_method" value="card"><span id="card-icon"></span><span>Karta</span></label>
        </div>
      </form>
      <div class="card">
        <div class="summary-row"><span>Jami</span><span id="total" class="total"></span></div>
        <p class="hint">Yakuniy summa buyurtma paytidagi narx bo'yicha hisoblanadi.</p>
      </div>
    </section>
  </main>
  <button id="place-order" class="btn main-button" type="button" hidden></button>
</body>
</html>
