name: Backend CI

on:
  pull_request:
    branches: [dev, stage, main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [dev, stage, main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lunch_test
          POSTGRES_USER: lunch
          POSTGRES_PASSWORD: lunch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lunch -d lunch_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://lunch:lunch@localhost:5432/lunch_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migratsiyalar
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Testlar
        run: uv run pytest -q
